name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Scripts compile
        run: python -m py_compile scripts/*.py
      - name: Public data matches README (no network)
        run: python scripts/check_public_data.py
      - name: Snapshot summary
        run: python scripts/summarize_udc.py data/udc_projects.csv
